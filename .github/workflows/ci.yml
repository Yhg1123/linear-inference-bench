name: CPU correctness checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        torch-version: ['2.5.1', '2.10.0']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install torch==${{ matrix.torch-version }} --index-url https://download.pytorch.org/whl/cpu
      - run: python -m unittest discover -s tests -v
      - run: python benchmark.py --cpu-only --batch-sizes 1 --warmup 1 --repeats 2 --output smoke-results
